{% extends "base/base.html" %}<!-- Usa tu base correcta -->

{% block title %}Vista de Flota | TecTrack{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/dueno/recorridos.css') }}">
{% endblock %}

{% block content %}
<div class="vista-flota-container">
    
    <!-- PANEL IZQUIERDO: Filtros y Lista Compacta -->
    <div class="panel-lateral">
        <div class="panel-header">
            <h3>Recorridos y Rutas</h3>
            <div class="filtros-compactos">
                <select id="filtro-estado" class="input-compacto">
                    <option value="">Estado: Todos</option>
                    <option value="en_curso">Activos</option>
                    <option value="finalizado">Finalizados</option>
                    <option value="cancelado">Cancelados</option>
                </select>
                <button id="btn-filtrar" class="btn-icon" title="Actualizar">↻</button>
            </div>
        </div>

        <div class="lista-recorridos" id="contenedor-recorridos">
            <div class="loading-texto">Cargando...</div>
        </div>

        <div class="paginacion-compacta">
            <button id="btn-prev" disabled>◀</button>
            <span id="texto-paginacion">1 / 1</span>
            <button id="btn-next" disabled>▶</button>
        </div>
    </div>

    <!-- PANEL DERECHO: Mapa Persistente -->
    <div class="panel-mapa">
        <div id="mapa-recorrido"></div>
        
        <!-- Tarjeta flotante sobre el mapa (opcional, para info del viaje seleccionado) -->
        <div id="info-viaje-flotante" class="info-flotante oculto">
            <h4 id="titulo-mapa-viaje">Selecciona un viaje</h4>
            <span id="badge-estado-mapa" class="badge-estado"></span>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/dueno/recorridos/index.js') }}"></script>
{% endblock %}

{% extends "base/base.html" %}
{% block title %}Editar vehículo - TrackSecurity{% endblock %}
{% block page_title %}Vehículos{% endblock %}
{% block content %}
<section class="legacy-redirect-card">
    <h2>Abriendo edición de vehículo…</h2>
    <p>La edición ahora se realiza en un modal dentro del listado.</p>
    <a class="btn btn-primary" href="{{ url_for('dueno_vehiculos') }}?editar={{ vehiculo_id }}">Continuar</a>
</section>
<script>window.location.replace("{{ url_for('dueno_vehiculos') }}?editar={{ vehiculo_id }}");</script>
{% endblock %}
